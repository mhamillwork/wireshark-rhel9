# Docker engine for the GitLab Kubernetes runner.
#
# The runner and its job pods are in the gitlab namespace. The claim, the
# Deployment, and the Service each set that namespace. Apply with -n gitlab.
# The kube context here is default, and applying without -n gitlab has been
# creating the pod in default. Delete the default objects first. A volume
# in default does not move to gitlab.
#
#   kubectl -n default delete deployment,service,pvc wireshark-docker --ignore-not-found
#   kubectl apply -f k8s/wireshark-docker.yaml -n gitlab
#
# Rebuild and push the job image first. The pod pulls
# artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
# and its command is dockerd. The pipeline does not build that image and
# does not apply this file.
#
# The pod is privileged so dockerd can mount overlay2 and load the netfilter
# modules. Before dockerd starts, the command enables cgroup v2 controllers,
# tries an overlay mount on the volume, then starts dockerd with iptables
# disabled. This kernel crashes dockerd when the bridge driver creates the
# DOCKER nat chain, so iptables stays off. Image builds use the pod network. When the image contains
# /etc/docker/tls, dockerd also uses --tlsverify so a plaintext TCP bind is
# not a future startup failure. The volume has to be a block filesystem such
# as ext4 or xfs.
# NFS cannot host overlay2. IPv6 iptables stay off. The node must already
# have overlay, br_netfilter, and iptable_nat loaded. The pod mounts
# /lib/modules, but a module that is not loaded on the node still leaves
# dockerd unable to start. Persist them in /etc/modules-load.d so a reboot
# loads them before the pod starts.
# The Service is ClusterIP. Leave it inside the cluster. Job pods in gitlab
# use DOCKER_HOST=tcp://wireshark-docker:2375. After the job image contains
# /etc/docker/tls, dockerd requires a client certificate.
#
# One volume holds /var/lib/docker, so wireshark-ubi9:dev survives a restart.
# The claim is ReadWriteOnce, so the Deployment uses Recreate.
# If the registry needs a pull secret, add imagePullSecrets on the pod.
# Size the pod for a Wireshark compile: the compiler runs in containers
# inside this pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireshark-docker
  namespace: gitlab
  labels:
    app: wireshark-docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireshark-docker
  template:
    metadata:
      labels:
        app: wireshark-docker
    spec:
      hostAliases:
        - ip: "10.10.106.59"
          hostnames:
            - satellite9b.hsv.local
      containers:
        - name: dockerd
          image: artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
          imagePullPolicy: Always
          command:
            - bash
            - -ceu
            - |
              if ! command -v dockerd >/dev/null 2>&1; then
                echo "dockerd is not in this image. Rebuild and push artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8 from dockerfile/Dockerfile.ubi9-tahaa-bootstrap-docker, then delete this pod so it pulls the new tag." >&2
                exit 1
              fi
              if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
                mkdir -p /sys/fs/cgroup/init
                while read -r pid; do
                  echo "$pid" >/sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
                done </sys/fs/cgroup/cgroup.procs
                for controller in $(cat /sys/fs/cgroup/cgroup.controllers); do
                  echo "+${controller}" >/sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo "left cgroup controller ${controller} disabled" >&2
                done
              fi
              umount /var/lib/docker/ovl-probe/m 2>/dev/null || true
              rm -rf /var/lib/docker/ovl-probe
              mkdir -p /var/lib/docker/ovl-probe/l /var/lib/docker/ovl-probe/u /var/lib/docker/ovl-probe/w /var/lib/docker/ovl-probe/m
              if ! mount -t overlay overlay -o lowerdir=/var/lib/docker/ovl-probe/l,upperdir=/var/lib/docker/ovl-probe/u,workdir=/var/lib/docker/ovl-probe/w /var/lib/docker/ovl-probe/m; then
                echo "This volume cannot mount overlay. The storage class has to be a block filesystem such as ext4 or xfs. NFS cannot host the overlay2 driver." >&2
                exit 1
              fi
              umount /var/lib/docker/ovl-probe/m
              rm -rf /var/lib/docker/ovl-probe
              echo 1 >/proc/sys/net/ipv4/ip_forward 2>/dev/null || echo "could not enable ip_forward" >&2
              if command -v modprobe >/dev/null 2>&1; then
                for module in ip_tables iptable_filter iptable_nat nf_tables nf_nat br_netfilter overlay; do
                  modprobe "$module" 2>/dev/null || echo "kernel module ${module} was not loaded" >&2
                done
              fi
              tls_args=()
              if [ -f /etc/docker/tls/ca.pem ] && [ -f /etc/docker/tls/server-cert.pem ] && [ -f /etc/docker/tls/server-key.pem ]; then
                tls_args=(--tlsverify --tlscacert=/etc/docker/tls/ca.pem --tlscert=/etc/docker/tls/server-cert.pem --tlskey=/etc/docker/tls/server-key.pem)
                echo "Starting dockerd with --iptables=false and --tlsverify."
              else
                echo "Starting dockerd with --iptables=false. This image has no TLS certificates, so the plaintext TCP warning remains until dockerfile/Dockerfile.ubi9-tahaa-bootstrap-docker is rebuilt and pushed." >&2
              fi
              exec dockerd --host=tcp://0.0.0.0:2375 --iptables=false --ip6tables=false "${tls_args[@]}" --storage-driver=overlay2 --data-root=/var/lib/docker --exec-opt native.cgroupdriver=cgroupfs
          securityContext:
            privileged: true
          ports:
            - name: docker
              containerPort: 2375
          readinessProbe:
            tcpSocket:
              port: docker
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: docker-data
          persistentVolumeClaim:
            claimName: wireshark-docker
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  selector:
    app: wireshark-docker
  ports:
    - name: docker
      port: 2375
      targetPort: docker
