# Docker engine for the GitLab Kubernetes runner.
#
# The runner and its job pods are in the gitlab namespace. The claim, the
# Deployment, and the Service each set that namespace. Apply with no -n flag.
# kubectl apply -n default overrides the namespace in this file and creates
# the objects in default. Delete those before applying again. A volume in
# default does not move to gitlab.
#
#   kubectl -n default delete deployment,service,pvc wireshark-docker --ignore-not-found
#   kubectl apply -f k8s/wireshark-docker.yaml
#
# Rebuild and push the job image first. The pod pulls
# artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
# and its command is dockerd. The pipeline does not build that image and
# does not apply this file.
#
# The pod is privileged so dockerd can mount overlay2 and load the netfilter
# modules. Before dockerd starts, the command enables cgroup v2 controllers,
# tries an overlay mount on the volume, and tries to create the DOCKER nat
# chain. When that chain cannot be created, dockerd starts with iptables
# disabled so the bridge driver still registers. Image builds then use the
# pod network. The volume has to be a block filesystem such as ext4 or xfs.
# NFS cannot host overlay2. IPv6 iptables stay off. /lib/modules comes from
# the node so modprobe can load iptable_nat.
# The Service is ClusterIP with no TLS. Leave it inside the cluster. Job pods
# in gitlab use DOCKER_HOST=tcp://wireshark-docker:2375.
#
# One volume holds /var/lib/docker, so wireshark-ubi9:dev survives a restart.
# The claim is ReadWriteOnce, so the Deployment uses Recreate.
# If the registry needs a pull secret, add imagePullSecrets on the pod.
# Size the pod for a Wireshark compile: the compiler runs in containers
# inside this pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireshark-docker
  namespace: gitlab
  labels:
    app: wireshark-docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireshark-docker
  template:
    metadata:
      labels:
        app: wireshark-docker
    spec:
      hostAliases:
        - ip: "10.10.106.59"
          hostnames:
            - satellite9b.hsv.local
      containers:
        - name: dockerd
          image: artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
          imagePullPolicy: Always
          command:
            - bash
            - -ceu
            - |
              if ! command -v dockerd >/dev/null 2>&1; then
                echo "dockerd is not in this image. Rebuild and push artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8 from dockerfile/Dockerfile.ubi9-tahaa-bootstrap-docker, then delete this pod so it pulls the new tag." >&2
                exit 1
              fi
              if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
                mkdir -p /sys/fs/cgroup/init
                while read -r pid; do
                  echo "$pid" >/sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
                done </sys/fs/cgroup/cgroup.procs
                for controller in $(cat /sys/fs/cgroup/cgroup.controllers); do
                  echo "+${controller}" >/sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || echo "left cgroup controller ${controller} disabled" >&2
                done
              fi
              umount /var/lib/docker/ovl-probe/m 2>/dev/null || true
              rm -rf /var/lib/docker/ovl-probe
              mkdir -p /var/lib/docker/ovl-probe/l /var/lib/docker/ovl-probe/u /var/lib/docker/ovl-probe/w /var/lib/docker/ovl-probe/m
              if ! mount -t overlay overlay -o lowerdir=/var/lib/docker/ovl-probe/l,upperdir=/var/lib/docker/ovl-probe/u,workdir=/var/lib/docker/ovl-probe/w /var/lib/docker/ovl-probe/m; then
                echo "This volume cannot mount overlay. The storage class has to be a block filesystem such as ext4 or xfs. NFS cannot host the overlay2 driver." >&2
                exit 1
              fi
              umount /var/lib/docker/ovl-probe/m
              rm -rf /var/lib/docker/ovl-probe
              echo 1 >/proc/sys/net/ipv4/ip_forward 2>/dev/null || echo "could not enable ip_forward" >&2
              if command -v modprobe >/dev/null 2>&1; then
                for module in ip_tables iptable_filter iptable_nat nf_tables nf_nat br_netfilter overlay; do
                  modprobe "$module" 2>/dev/null || echo "kernel module ${module} was not loaded" >&2
                done
              fi
              nat_chain_creates() {
                local err
                err="$(mktemp)"
                if "$1" -t nat -N DOCKER >"$err" 2>&1; then
                  rm -f "$err"
                  return 0
                fi
                if grep -q 'already exists' "$err"; then
                  rm -f "$err"
                  return 0
                fi
                echo "iptables candidate $1 could not create the DOCKER nat chain:" >&2
                cat "$err" >&2
                rm -f "$err"
                return 1
              }
              chosen=""
              for candidate in iptables-nft iptables-legacy iptables; do
                if command -v "$candidate" >/dev/null 2>&1 && nat_chain_creates "$candidate"; then
                  chosen="$candidate"
                  break
                fi
              done
              iptables_arg="--iptables=false"
              if [ -n "$chosen" ]; then
                mkdir -p /usr/local/sbin
                target="$(command -v "$chosen")"
                ln -sfn "$target" /usr/local/sbin/iptables
                if [ "$target" != /usr/sbin/iptables ]; then
                  ln -sfn "$target" /usr/sbin/iptables
                fi
                case "$chosen" in
                  iptables-nft) ln -sfn "$(command -v ip6tables-nft)" /usr/local/sbin/ip6tables 2>/dev/null || true ;;
                  iptables-legacy) ln -sfn "$(command -v ip6tables-legacy)" /usr/local/sbin/ip6tables 2>/dev/null || true ;;
                esac
                export PATH="/usr/local/sbin:${PATH}"
                iptables_arg="--iptables=true"
                echo "using ${chosen} for the DOCKER nat chain"
              else
                echo "Starting dockerd with --iptables=false. The DOCKER nat chain cannot be created in this pod. Image builds use the pod network." >&2
              fi
              exec dockerd --host=tcp://0.0.0.0:2375 "$iptables_arg" --ip6tables=false --storage-driver=overlay2 --data-root=/var/lib/docker --exec-opt native.cgroupdriver=cgroupfs
          securityContext:
            privileged: true
          ports:
            - name: docker
              containerPort: 2375
          readinessProbe:
            tcpSocket:
              port: docker
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: docker-data
          persistentVolumeClaim:
            claimName: wireshark-docker
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  selector:
    app: wireshark-docker
  ports:
    - name: docker
      port: 2375
      targetPort: docker
