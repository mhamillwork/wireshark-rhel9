# Docker engine for the GitLab Kubernetes runner.
#
# The runner and its job pods are in the gitlab namespace. The claim, the
# Deployment, and the Service each set that namespace, so apply creates them
# there regardless of the current kubectl context:
#
#   kubectl apply -f k8s/wireshark-docker.yaml
#
# The image is the job image. Rebuild and push
# artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
# so the tag contains dockerd before the pod starts. The pipeline does not
# build that image and does not apply this file.
#
# The pod is privileged so dockerd can mount overlay2. Its iptables rules
# stay in the pod network namespace. The Service is ClusterIP with no TLS.
# Leave it inside the cluster. Job pods in gitlab use
# DOCKER_HOST=tcp://wireshark-docker:2375.
#
# One volume holds /var/lib/docker, so wireshark-ubi9:dev survives a restart.
# The claim is ReadWriteOnce, so the Deployment uses Recreate.
# If the registry needs a pull secret, add imagePullSecrets on the pod.
# Size the pod for a Wireshark compile: the compiler runs in containers
# inside this pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireshark-docker
  namespace: gitlab
  labels:
    app: wireshark-docker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireshark-docker
  template:
    metadata:
      labels:
        app: wireshark-docker
    spec:
      containers:
        - name: dockerd
          image: artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
          imagePullPolicy: Always
          command:
            - dockerd
            - --host=tcp://0.0.0.0:2375
            - --iptables=true
            - --storage-driver=overlay2
            - --data-root=/var/lib/docker
          securityContext:
            privileged: true
          ports:
            - name: docker
              containerPort: 2375
          readinessProbe:
            tcpSocket:
              port: docker
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: docker-data
          persistentVolumeClaim:
            claimName: wireshark-docker
---
apiVersion: v1
kind: Service
metadata:
  name: wireshark-docker
  namespace: gitlab
spec:
  selector:
    app: wireshark-docker
  ports:
    - name: docker
      port: 2375
      targetPort: docker
