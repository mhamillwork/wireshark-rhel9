# Manual compile session. The image is loaded locally (docker load / docker build);
# Compose does not pull it from a registry.
#
# /src/scripts stays in the image. Do not mount the checkout on /src: that
# covers the scripts, and a writable mount lets the container remove them
# from the workstation. Sources and plugins are read-only. Only src/build
# is writable, so the compile output is written back to the checkout.
#
# Host networking lets Wireshark see the workstation interfaces. The X11
# socket and DISPLAY let /src/build/run/wireshark open on the workstation
# display. Run Compose from that graphical session so DISPLAY is set.
services:
  wireshark-compile:
    image: ${WIRESHARK_IMAGE:-wireshark-ubi9:dev}
    pull_policy: ${WIRESHARK_PULL_POLICY:-if_not_present}
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /src
    command: sleep infinity
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - type: bind
        source: ${HOME}/sandbox/wireshark-packet-penguin
        target: /workspace
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/sandbox/wireshark-packet-penguin/src/wireshark-4.6.9
        target: /src/wireshark-4.6.9
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/sandbox/wireshark-packet-penguin/src/plugins
        target: /src/plugins
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/sandbox/wireshark-packet-penguin/src/build
        target: /src/build
      - type: bind
        source: ${SANDBOX_DIR:-${HOME}/sandbox}
        target: /sandbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /tmp/.Xauthority
        read_only: true
        bind:
          create_host_path: false
