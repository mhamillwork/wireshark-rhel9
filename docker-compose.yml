# Manual compile session. The image is loaded locally (docker load / docker build);
# Compose does not pull it from a registry.
#
# The workstation GitLab checkout is mounted at /src, so
# /src/scripts/compile-wireshark.sh compiles that tree and writes /src/build
# back to ${HOME}/sandbox/wireshark-packet-penguin/src.
services:
  wireshark-compile:
    image: ${WIRESHARK_IMAGE:-wireshark-ubi9:dev}
    pull_policy: ${WIRESHARK_PULL_POLICY:-if_not_present}
    stdin_open: true
    tty: true
    working_dir: /src
    command: sleep infinity
    volumes:
      - ${HOME}/sandbox/wireshark-packet-penguin:/workspace:ro
      - ${HOME}/sandbox/wireshark-packet-penguin/src:/src
      - ${SANDBOX_DIR:-${HOME}/sandbox}:/sandbox
