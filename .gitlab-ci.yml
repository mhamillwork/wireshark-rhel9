# Isolated GitLab: load wireshark-ubi9:dev on the runner (docker load) before
# this job. The image contains /src/wireshark-4.6.9, /src/scripts, and
# /src/plugins. The job runs /src/scripts/compile-wireshark.sh, including
# the Qt 5 GUI from RHEL 9.

stages:
  - compile

variables:
  WIRESHARK_IMAGE: wireshark-ubi9:dev

compile-wireshark:
  stage: compile
  image:
    name: $WIRESHARK_IMAGE
    pull_policy: if-not-present
    entrypoint: [""]
  script:
    - /src/scripts/compile-wireshark.sh
    - /src/build/run/tshark -n -r /src/wireshark-4.6.9/test/captures/dhcp.pcap
    - mkdir -p build/run && cp -a /src/build/run/. build/run/
  artifacts:
    paths:
      - build/run/
    expire_in: 7 days
