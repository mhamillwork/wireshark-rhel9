# Isolated GitLab: load wireshark-ubi9:dev on the runner (docker load) before
# this job. GitLab checks out this repository, which already contains the
# Wireshark 4.6.9 sources under src/wireshark-4.6.9, then the job compiles them,
# including the Qt 5 GUI from RHEL 9.

stages:
  - compile

variables:
  WIRESHARK_IMAGE: wireshark-ubi9:dev

compile-wireshark:
  stage: compile
  image:
    name: $WIRESHARK_IMAGE
    pull_policy: if-not-present
    entrypoint: [""]
  script:
    - ./scripts/compile-wireshark.sh
    - |
      capture=""
      for p in \
        src/wireshark-4.6.9/test/captures/dhcp.pcap \
        /src/wireshark-4.6.9/test/captures/dhcp.pcap \
        wireshark/test/captures/dhcp.pcap
      do
        if [ -f "$p" ]; then
          capture=$p
          break
        fi
      done
      test -n "$capture"
      ./build/run/tshark -n -r "$capture"
  artifacts:
    paths:
      - build/run/
    expire_in: 7 days
