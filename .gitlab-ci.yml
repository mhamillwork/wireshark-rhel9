# RHEL 9 build. The compile-image job builds
# dockerfile/Dockerfile.wireshark-ubi9-build and tags it wireshark-ubi9:dev.
# That build reaches Satellite with --add-host. Compile, test, rpm, and
# package-test then run commands in that local tag through
# src/scripts/run-compile-image.sh. Validate checks this checkout in the job
# container: the compile image does not contain dockerfile/ or tests/.
# GitLab does not pull wireshark-ubi9:dev. The job image is
# ubi9-tahaa-bootstrap-docker. That tag is ubi9-tahaa-bootstrap plus the
# Artifactory yum repo for the Docker RPMs. Its Dockerfile starts FROM that
# tag and installs the Docker client and dockerd. The compile and runtime
# Dockerfiles still FROM ubi9-tahaa-bootstrap.
#
# Kubernetes nodes do not provide a Docker socket. Apply
# k8s/wireshark-docker.yaml. Its objects are in the gitlab namespace, with
# the runner. That Deployment runs dockerd from this same image, privileged,
# and keeps the local tags on its volume. DOCKER_HOST below points every job
# at that Service. The engine listens with plain HTTP. Do not set a TLS
# verify flag or a certificate path: the client then posts to https:// and
# the engine answers with HTTP. A shell runner with its own engine overrides
# DOCKER_HOST to unix:///var/run/docker.sock.
# compile-image and the jobs that run the compile image must use the same
# Docker daemon, because the tag stays on that daemon.
#
# Leave BuildKit enabled. Setting it off selects the legacy builder, which
# this Docker client warns will be removed.
#
# Do not set image pull_policy. This runner's allowed_pull_policies list is
# empty, so a policy in this file is rejected before the job starts.
#
# BUILD_TYPE defaults to dev. A branch pipeline publishes development image
# tags only. It does not publish the release images or the RPM.
#
# The release Git tag publishes, from versions/RHEL9.env, even when
# BUILD_TYPE is still dev. GitLab starts that pipeline with the default.
# A tag pipeline has no CI_COMMIT_BRANCH, so a dev-only publish rule
# dropped the job and nothing was pushed.
#   oci://<registry>/<image-repo>/<image>:<version>-ppv<plugin>-rhel<rhel>
#   oci://<registry>/<image-repo>/<image>:<version>-ppv<plugin>-rhel<rhel>-build
#   the RPM into <registry>/artifactory/<rpm-repo>/
# Docker pushes the same image names without the oci:// scheme.
# The tag has to be protected: CI_COMMIT_REF_PROTECTED=true.
# CI_COMMIT_TAG has to equal that release tag.
# A BUILD_TYPE variable by itself cannot publish a release.

stages:
  - image
  - validate
  - compile
  - test
  - rpm
  - package-test
  - docker
  - publish

variables:
  BOOTSTRAP_IMAGE: artifactory.tahaa.local/tahaa-image-local/ubi9/ubi9-tahaa-bootstrap-docker:9.8
  # Plain HTTP. The running engine does not use TLS.
  DOCKER_HOST: tcp://wireshark-docker:2375
  WIRESHARK_IMAGE: wireshark-ubi9:dev
  # Runtime image. A separate tag so the build does not replace the compile image.
  LOCAL_IMAGE: wireshark-ppv:candidate
  BUILD_TYPE:
    value: "dev"
    options:
      - "dev"
      - "release"
    description: "dev is the default. release publishes the release images and the RPM from the protected Git tag"
  ARTIFACTORY_REGISTRY: artifactory.tahaa.local
  ARTIFACTORY_REPOSITORY: tahaa-image-local

default:
  image:
    name: $BOOTSTRAP_IMAGE
    entrypoint: [""]
  interruptible: true

compile-image:
  stage: image
  script:
    - ./src/scripts/release-preflight.sh
    - |
      unset DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_BUILDKIT
      command -v docker >/dev/null 2>&1 || { echo "docker is required to build the compile image" >&2; exit 1; }
      docker build \
        --network=host \
        --add-host satellite9b.hsv.local:10.10.106.59 \
        -f dockerfile/Dockerfile.wireshark-ubi9-build \
        -t "${WIRESHARK_IMAGE}" .

validate:
  stage: validate
  needs: ["compile-image"]
  script:
    - ./src/scripts/validate-repo.sh
    - test "$BUILD_TYPE" = dev -o "$BUILD_TYPE" = release

compile:
  stage: compile
  needs: ["validate"]
  script:
    - ./src/scripts/run-compile-image.sh ./src/scripts/compile-wireshark.sh --rhel 9 --build

test-compile:
  stage: test
  needs: ["compile"]
  script:
    - ./src/scripts/run-compile-image.sh ./src/scripts/compile-wireshark.sh --rhel 9 --test

rpm:
  stage: rpm
  needs: ["test-compile"]
  script:
    - ./src/scripts/run-compile-image.sh ./src/scripts/compile-wireshark.sh --rhel 9 --package

package-test:
  stage: package-test
  needs: ["rpm"]
  script:
    - ./src/scripts/run-compile-image.sh ./src/scripts/test-rpm.sh

docker-image:
  stage: docker
  needs:
    - job: package-test
      artifacts: false
    - job: rpm
      artifacts: false
  script:
    - ./src/scripts/run-compile-image.sh true
    - ./src/scripts/write-build-metadata.sh
    - test -n "$(find src/artifacts/rpms/rhel9 -name '*.rpm' -print -quit)"
    - |
      set -euo pipefail
      unset DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_BUILDKIT
      command -v docker >/dev/null 2>&1 || { echo "docker is required to build the runtime image" >&2; exit 1; }
      set -a
      # shellcheck disable=SC1091
      . ./versions/RHEL9.env
      set +a
      image_build_type="${BUILD_TYPE}"
      release_tag="${WIRESHARK_VERSION}-ppv${PACKET_PENGUIN_VERSION}-rhel${RHEL_VERSION}"
      if [ "${CI_COMMIT_TAG:-}" = "$release_tag" ]; then
        image_build_type=release
      fi
      docker build --network=host --add-host satellite9b.hsv.local:10.10.106.59 \
        -f dockerfile/Dockerfile.wireshark-ubi9-runtime \
        --build-arg "WIRESHARK_VERSION=${WIRESHARK_VERSION}" \
        --build-arg "PACKET_PENGUIN_VERSION=${PACKET_PENGUIN_VERSION}" \
        --build-arg "RHEL_VERSION=${RHEL_VERSION}" \
        --build-arg "GIT_COMMIT=${CI_COMMIT_SHA:-local}" \
        --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --build-arg "PIPELINE_ID=${CI_PIPELINE_ID:-local}" \
        --build-arg "BUILD_TYPE=${image_build_type}" \
        --build-arg "RPM_DIR=src/artifacts/rpms/rhel${RHEL_VERSION}" \
        -t "${LOCAL_IMAGE}" .
      # The image command is the GUI. This job has no display, so both
      # binaries are checked with the offscreen Qt platform.
      docker run --rm -e QT_QPA_PLATFORM=offscreen "${LOCAL_IMAGE}" /usr/local/bin/tshark -v
      docker run --rm -e QT_QPA_PLATFORM=offscreen "${LOCAL_IMAGE}" /usr/local/bin/wireshark --version

publish:
  stage: publish
  needs:
    - job: docker-image
      artifacts: false
    - job: rpm
      artifacts: false
  resource_group: wireshark-artifactory
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Every branch and every tag. The release tag publishes the release
    # images and the RPM even when BUILD_TYPE is still dev. The scripts
    # require CI_COMMIT_REF_PROTECTED=true and CI_COMMIT_TAG equal to the
    # release tag. Leaving the job out hid that failure.
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
    - when: never
  script:
    - |
      set -euo pipefail
      unset DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_BUILDKIT
      command -v docker >/dev/null 2>&1 || { echo "docker is required to publish" >&2; exit 1; }
      docker image inspect "${LOCAL_IMAGE}" >/dev/null 2>&1 || { echo "runtime image ${LOCAL_IMAGE} is not on this Docker daemon" >&2; exit 1; }
    - ./src/scripts/run-compile-image.sh true
    - |
      set -euo pipefail
      set -a
      # shellcheck disable=SC1091
      . ./versions/RHEL9.env
      set +a
      release_tag="${WIRESHARK_VERSION}-ppv${PACKET_PENGUIN_VERSION}-rhel${RHEL_VERSION}"
      echo "BUILD_TYPE=${BUILD_TYPE:-dev} CI_COMMIT_TAG=${CI_COMMIT_TAG:-} CI_COMMIT_REF_PROTECTED=${CI_COMMIT_REF_PROTECTED:-} release_tag=${release_tag}"
      ./src/scripts/publish-image.sh
      if [ "${BUILD_TYPE:-dev}" = release ] || [ "${CI_COMMIT_TAG:-}" = "$release_tag" ]; then
        ./src/scripts/publish-rpm.sh
      fi
    - ./src/scripts/write-build-metadata.sh

cleanup-workspace:
  stage: publish
  needs:
    - job: package-test
      optional: true
    - job: docker-image
      optional: true
    - job: publish
      optional: true
  when: always
  allow_failure: true
  script:
    - |
      unset DOCKER_TLS_VERIFY DOCKER_CERT_PATH DOCKER_BUILDKIT
      if command -v docker >/dev/null 2>&1; then
        docker volume rm -f "wireshark-${CI_PIPELINE_ID}" || true
      fi
