# RHEL 9 compile test. The runner pulls the compile image
# artifactory.tahaa.local/tahaa-image-local/wireshark:dev.
# Build that image from dockerfile/Dockerfile.wireshark-ubi9-build and
# push it by hand. These jobs compile the Git checkout with the tools in
# that image. They do not build or publish container images.
#
# Do not set image pull_policy. This runner's allowed_pull_policies list is
# empty, so a policy in this file is rejected before the job starts.
#
# BUILD_TYPE defaults to dev. The pipeline records the value and does not
# publish from it.

stages:
  - validate
  - compile
  - test
  - rpm
  - package-test

variables:
  COMPILE_IMAGE: artifactory.tahaa.local/tahaa-image-local/wireshark:dev
  BUILD_TYPE:
    value: "dev"
    options:
      - "dev"
      - "release"
    description: "Recorded by the validate job. This pipeline does not publish"

default:
  image:
    name: $COMPILE_IMAGE
    entrypoint: [""]
  interruptible: true

validate:
  stage: validate
  script:
    - ./src/scripts/validate-repo.sh
    - test "$BUILD_TYPE" = dev -o "$BUILD_TYPE" = release

compile:
  stage: compile
  needs: ["validate"]
  script:
    - ./src/scripts/compile-wireshark.sh --rhel 9 --build
  artifacts:
    paths:
      - src/build/rhel9/wireshark/run/
      - src/build/rhel9/logs/
    expire_in: 7 days

test-compile:
  stage: test
  needs: ["compile"]
  script:
    - ./src/scripts/compile-wireshark.sh --rhel 9 --test
  artifacts:
    paths:
      - src/build/rhel9/logs/
    expire_in: 7 days

rpm:
  stage: rpm
  needs: ["test-compile"]
  script:
    - ./src/scripts/compile-wireshark.sh --rhel 9 --package
  artifacts:
    paths:
      - src/artifacts/rpms/rhel9/
      - src/build/rhel9/logs/
      - src/build/rhel9/staging/
    expire_in: 14 days

package-test:
  stage: package-test
  needs: ["rpm"]
  script:
    - ./src/scripts/test-rpm.sh
  artifacts:
    paths:
      - src/build/rhel9/logs/package-test.txt
    expire_in: 14 days
